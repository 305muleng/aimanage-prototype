spring.application.name=aimanage-prototype
spring.profiles.default=mysql
server.port=8080

# H2 备用配置；默认启用 MySQL，显式选择 h2 profile 时使用此配置。
spring.datasource.url=jdbc:h2:file:./data/aimanage;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

server.servlet.session.timeout=60m
server.error.include-message=always
