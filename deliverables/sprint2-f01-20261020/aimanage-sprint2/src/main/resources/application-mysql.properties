# 通过环境变量注入数据库连接信息，避免把本机密码写入源代码。
spring.datasource.url=${AIMANAGE_DB_URL:jdbc:mysql://localhost:3306/aimanage?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${AIMANAGE_DB_USERNAME:aimanage_app}
spring.datasource.password=${AIMANAGE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
