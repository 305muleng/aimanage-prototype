<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务详情 · 爱管理</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/collaboration.css}">
</head>
<body class="app-page modern-icons"><div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('tasks')}"></aside>
    <main class="main-column"><header class="page-toolbar"><a th:if="${!detail.historical}" th:href="@{/tasks(projectId=${detail.task.projectId})}">返回项目看板</a><a th:if="${detail.historical}" th:href="@{/my-tasks}">返回我的任务</a></header>
        <div class="page-content">
            <div class="notice success" th:if="${success}" th:text="${success}"></div>
            <div class="notice error" th:if="${error}" th:text="${error}"></div>
            <p class="secondary-text" th:if="${detail.historical}">历史任务：你已离开此项目，仅可查看本人完成的任务资料。</p>
            <section class="document-title"><h1 th:text="${detail.task.title}"></h1><p th:text="${detail.task.projectName}"></p></section>
            <section class="collaboration-section">
                <p class="preserve-lines" th:text="${detail.description}"></p>
                <p th:text="|负责人：${detail.task.assigneeName} · 状态：${detail.task.status.label}|"></p>
                <p th:text="|优先级：${detail.task.priority} · 截止：${detail.task.dueDate != null ? detail.task.dueDate : '未设置'}|"></p>
                <p class="preserve-lines" th:if="${detail.task.status.name() == 'DONE'}" th:text="|完成说明：${#strings.isEmpty(detail.task.completionNote) ? '旧记录未填写' : detail.task.completionNote}|"></p>
                <p th:if="${detail.task.completedAt != null}" th:text="|完成时间：${#temporals.format(detail.task.completedAt, 'yyyy-MM-dd HH:mm:ss')}|"></p>
                <form class="inline-status-form" method="post" th:if="${detail.canChangeStatus}" th:action="@{/tasks/{id}/status(id=${detail.task.id})}">
                    <input type="hidden" name="csrfToken" th:value="${csrfToken}">
                    <input type="hidden" name="version" th:value="${detail.task.version}">
                    <label>更新状态<select class="notion-input" name="status"><option th:each="s : ${statuses}" th:if="${!detail.owner or s.name() != 'DONE'}" th:value="${s}" th:selected="${s == detail.task.status}" th:text="${s.label}"></option></select></label>
                    <label>完成说明／重开原因<input class="notion-input" name="note" maxlength="1000" placeholder="完成或重开时必填"></label>
                    <button class="notion-button" type="submit">保存状态</button>
                </form>
            </section>
            <section class="collaboration-section">
                <h2>阻塞情况</h2>
                <p th:text="${detail.task.blocked ? detail.task.blockedReason : '当前未阻塞'}"></p>
                <form method="post" th:if="${detail.canBlock}" th:action="@{/tasks/{id}/block(id=${detail.task.id})}">
                    <input type="hidden" name="csrfToken" th:value="${csrfToken}">
                    <input type="hidden" name="version" th:value="${detail.task.version}">
                    <label>阻塞原因<textarea class="notion-input" name="reason" maxlength="500" rows="2" th:text="${detail.task.blockedReason}"></textarea></label>
                    <div class="task-actions"><button class="notion-button" name="blocked" value="true" type="submit" th:if="${detail.task.status.name() != 'DONE'}">保存阻塞</button><button class="notion-button" name="blocked" value="false" type="submit">解除阻塞</button></div>
                </form>
            </section>
            <section class="collaboration-section">
                <h2>任务依赖</h2><p class="secondary-text">允许提前开始，但完成前须解除阻塞并完成所有前置任务。若已有后续任务完成，须先重开后续任务。</p>
                <h3>前置任务</h3>
                <p th:if="${#lists.isEmpty(detail.predecessors)}">暂无前置任务</p>
                <div class="dependency-row" th:each="t : ${detail.predecessors}">
                    <a th:href="@{/tasks/{id}(id=${t.id})}" th:text="${t.title}"></a><span th:text="${t.status.label}"></span>
                    <span class="secondary-text" th:if="${t.status.name() != 'DONE'}">前置任务未完成，请确认执行进度</span>
                    <form method="post" th:if="${detail.owner}" th:action="@{/tasks/{id}/dependencies(id=${detail.task.id})}">
                        <input type="hidden" name="csrfToken" th:value="${csrfToken}"><input type="hidden" name="predecessorId" th:value="${t.id}"><input type="hidden" name="remove" value="true">
                        <button class="notion-button" type="submit">移除关系</button>
                    </form>
                </div>
                <p class="secondary-text" th:if="${detail.owner and detail.task.status.name() == 'DONE'}">新增依赖前请先重开任务。</p>
                <form class="task-actions" method="post" th:if="${detail.owner and detail.task.status.name() != 'DONE' and !#lists.isEmpty(detail.candidates)}" th:action="@{/tasks/{id}/dependencies(id=${detail.task.id})}">
                    <input type="hidden" name="csrfToken" th:value="${csrfToken}">
                    <label>添加前置任务<select class="notion-input" name="predecessorId"><option th:each="t : ${detail.candidates}" th:value="${t.id}" th:text="${t.title}"></option></select></label>
                    <button class="notion-button" type="submit">添加依赖</button>
                </form>
                <h3>后续任务</h3><p th:if="${#lists.isEmpty(detail.successors)}">暂无后续任务</p>
                <p th:each="t : ${detail.successors}"><a th:href="@{/tasks/{id}(id=${t.id})}" th:text="${t.title}"></a></p>
            </section>
            <section class="collaboration-section">
                <h2>评论与操作记录</h2>
                <form method="post" th:if="${detail.canComment}" th:action="@{/tasks/{id}/comments(id=${detail.task.id})}">
                    <input type="hidden" name="csrfToken" th:value="${csrfToken}">
                    <label>评论<textarea class="notion-input" name="content" maxlength="2000" rows="3" required></textarea></label>
                    <button class="notion-button" type="submit">发表评论</button>
                </form>
                <p th:unless="${detail.canComment}" class="secondary-text" th:text="${detail.historical ? '历史任务只读' : '当前任务只读'}"></p>
                <p th:if="${#lists.isEmpty(detail.entries)}">暂无记录</p>
                <article class="task-entry" th:each="e : ${detail.entries}">
                    <p><b th:text="${e.authorName}"></b> <span th:text="${e.kind == 'COMMENT' ? '评论' : '操作'}"></span> <time th:text="${#temporals.format(e.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></time></p>
                    <p class="preserve-lines" th:text="${e.content}"></p>
                </article>
            </section>
        </div>
    </main>
</div></body></html>
