<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sprint 甘特图 · 爱管理</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/gantt.css}"><link rel="stylesheet" th:href="@{/css/sprint-header.css}"></head>
<body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('sprints')}"></aside><main class="main-column"><header th:replace="~{fragments/sprint-header :: toolbar('gantt')}"></header><div class="page-content gantt-page">
<section th:replace="~{fragments/sprint-header :: heading('gantt')}"></section>
<p th:if="${error}" th:text="${error}" class="notice error"></p><p th:if="${success}" th:text="${success}" class="notice success"></p>
<form method="get" th:action="@{/sprints}" class="gantt-filters" th:if="${!#lists.isEmpty(projects)}">
<label>项目<select name="projectId" class="notion-input" onchange="this.form.requestSubmit()"><option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}" th:selected="${p.id == projectId}"></option></select></label>
<label>迭代<select name="sprintId" class="notion-input" onchange="this.form.requestSubmit()"><option value="">全部迭代</option><option th:each="it : ${iterations}" th:value="${it.id}" th:selected="${it.id == sprintId}" th:text="${it.label}"></option></select></label><input th:if="${storyId != null}" type="hidden" name="storyId" th:value="${storyId}"><label>旧地图标签<select name="lane" class="notion-input" onchange="this.form.requestSubmit()"><option value="ALL" th:selected="${lane == 'ALL'}">全部任务</option><option th:each="l : ${lanes}" th:value="${l}" th:text="${l == 'UNPLANNED' ? '待规划' : l.replace('SPRINT','Sprint ')}" th:selected="${lane == l}"></option></select></label>
<label>视窗开始<input type="date" name="from" class="notion-input" th:value="${from}" onchange="this.form.requestSubmit()"></label></form>
<div class="gantt-stats"><div><small>任务总数</small><strong th:text="${total}"></strong></div><div><small>待处理</small><strong th:text="${todo}"></strong></div><div><small>进行中</small><strong th:text="${doing}"></strong></div><div><small>已完成</small><strong th:text="${done}"></strong></div><div><small>完成率</small><strong th:text="|${progress}%|"></strong></div><div><small>逾期未完成</small><strong th:text="${overdue}"></strong></div></div>
<div class="gantt-toolbar"><h2>任务时间线</h2><div class="gantt-legend"><span class="todo">待处理</span><span class="in_progress">进行中</span><span class="done">已完成</span></div><div th:if="${projectId != null}"><a class="notion-button" th:href="@{/sprints(projectId=${projectId},lane=${lane},sprintId=${sprintId},storyId=${storyId},from=${prev})}">← 前四周</a><a class="notion-button" th:href="@{/sprints(projectId=${projectId},lane=${lane},from=${next})}">后四周 →</a></div></div>
<div class="gantt-scroll"><table class="gantt-table"><thead><tr><th class="gantt-task-column">任务 / 负责人</th><th class="gantt-date-column">计划日期</th><th class="gantt-day-heading" th:each="day : ${days}" th:classappend="${day == today ? 'today' : ''}"><span th:text="${#temporals.format(day,'M/d')}"></span><small th:text="${#temporals.format(day,'EEE')}"></small></th></tr></thead>
<tbody><tr th:each="row : ${rows}"><td class="gantt-task-column"><a th:href="${editable ? '/manager#task-' + row.task.id : '/my-tasks'}"><b th:text="${row.task.title}"></b></a><div class="gantt-task-meta"><span th:text="${row.task.assignee.displayName}"></span><span th:text="${row.task.status.label}"></span></div></td>
<td class="gantt-date-column"><small th:if="${row.scheduled}" th:text="|${row.task.startDate} → ${row.task.dueDate}|"></small><small th:unless="${row.scheduled}">未设置完整计划</small>
<details th:if="${editable}"><summary>设置日期</summary><form method="post" th:action="@{/sprints}" class="gantt-date-form"><input type="hidden" name="projectId" th:value="${projectId}"><input type="hidden" name="taskId" th:value="${row.task.id}"><input type="hidden" name="csrfToken" th:value="${csrf}"><label>开始<input class="notion-input" type="date" name="startDate" th:value="${row.task.startDate}" required></label><label>结束<input class="notion-input" type="date" name="dueDate" th:value="${row.task.dueDate}" required></label><button class="notion-button">保存</button></form></details></td>
<td th:each="active,stat : ${row.cells}" class="gantt-day" th:classappend="${(days[stat.index] == today ? 'today ' : '') + (days[stat.index].dayOfWeek.value >= 6 ? 'weekend' : '')}"><a th:if="${active}" class="gantt-bar" th:classappend="${#strings.toLowerCase(row.task.status.name())}" th:href="${editable ? '/manager#task-' + row.task.id : '/my-tasks'}" th:title="|${row.task.title} · ${row.task.startDate} — ${row.task.dueDate}|"><span class="sr-only" th:text="${row.task.title}"></span></a></td></tr>
<tr th:if="${#lists.isEmpty(rows)}"><td colspan="30" class="gantt-empty">当前范围暂无任务</td></tr></tbody></table></div>
</div></main></div></body></html>
