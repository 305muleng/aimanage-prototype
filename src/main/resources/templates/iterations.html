<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprint 管理 · 爱管理</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/sprint-header.css}"><style>.iteration-list{display:grid;gap:20px}.iteration-card{border:1px solid #e1e7ed;border-radius:12px;padding:24px}.iteration-card h2{margin:0 0 8px}.iteration-period{color:#557c9b}.iteration-card details{margin-top:18px}.iteration-form{max-width:720px}.iteration-stories a{display:block;padding:10px 0;border-bottom:1px solid #eef1f4}.iteration-card summary{cursor:pointer;color:#557c9b}</style></head>
<body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('sprints')}"></aside><main class="main-column"><header th:replace="~{fragments/sprint-header :: toolbar('overview')}"></header><div class="page-content"><section th:replace="~{fragments/sprint-header :: heading('overview')}"></section>
<p th:if="${success}" th:text="${success}" role="status"></p><p th:if="${error}" th:text="${error}" class="notice error"></p>
<form method="get" th:if="${!#lists.isEmpty(projects)}"><label>项目<select class="notion-input" name="projectId" onchange="this.form.requestSubmit()"><option th:each="p : ${projects}" th:value="${p.id}" th:selected="${p.id == projectId}" th:text="${p.name}"></option></select></label></form>
<details th:if="${editable and projectId != null}" class="iteration-card"><summary>＋ 新建迭代</summary><form method="post" th:action="@{/iterations}" class="form-stack iteration-form"><input type="hidden" name="projectId" th:value="${projectId}"><input type="hidden" name="csrfToken" th:value="${csrf}"><label>名称<input name="name" class="notion-input" maxlength="120" required></label><label>目标<textarea name="goal" class="notion-input" maxlength="2000"></textarea></label><div class="form-grid"><label>开始日期<input name="startDate" type="date" class="notion-input" required></label><label>结束日期<input name="endDate" type="date" class="notion-input" required></label></div><button class="notion-button primary-action">创建迭代</button></form></details>
<p th:if="${#lists.isEmpty(iterations)}">尚未创建真实迭代。原故事地图标签仍保留，不会自动转换为迭代。</p>
<div class="iteration-list"><article th:each="it : ${iterations}" class="iteration-card"><h2 th:text="${it.name}"></h2><p class="iteration-period" th:text="|${it.startDate} — ${it.endDate}|"></p><p th:text="${it.goal}"></p>
<a class="notion-button" th:href="@{/sprints(projectId=${projectId},sprintId=${it.id})}">查看任务甘特图 ↗</a><a class="notion-button" th:href="@{/backlog(projectId=${projectId})}">从用户故事规划范围 ↗</a>
<details open><summary>迭代故事</summary><div class="iteration-stories"><a th:each="story : ${stories}" th:if="${story.sprint != null and story.sprint.id == it.id}" th:href="@{/backlog(projectId=${projectId})} + '#item-' + ${story.id}" th:text="${story.title}"></a></div></details>
<details th:if="${editable}"><summary>编辑名称、目标与周期</summary><form method="post" th:action="@{/iterations}" class="form-stack iteration-form"><input type="hidden" name="projectId" th:value="${projectId}"><input type="hidden" name="id" th:value="${it.id}"><input type="hidden" name="csrfToken" th:value="${csrf}"><label>名称<input name="name" class="notion-input" maxlength="120" required th:value="${it.name}"></label><label>目标<textarea name="goal" class="notion-input" maxlength="2000" th:text="${it.goal}"></textarea></label><div class="form-grid"><label>开始日期<input name="startDate" type="date" class="notion-input" required th:value="${it.startDate}"></label><label>结束日期<input name="endDate" type="date" class="notion-input" required th:value="${it.endDate}"></label></div><button class="notion-button primary-action">保存迭代</button></form></details></article></div>
</div></main></div></body></html>
