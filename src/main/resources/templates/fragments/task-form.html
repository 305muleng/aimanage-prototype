<form th:fragment="taskForm(task)" class="form-stack" method="post" th:action="@{/manager/tasks/save}" xmlns:th="http://www.thymeleaf.org">
<input type="hidden" name="csrfToken" th:value="${projectCsrf}"><input type="hidden" name="projectId" th:value="${view.project.id}"><input th:if="${task != null}" type="hidden" name="id" th:value="${task.id}">
<label>任务标题<input name="title" class="notion-input" required maxlength="120" th:value="${task == null ? '' : task.title}"></label>
<label>所属用户故事<select name="storyId" class="notion-input"><option value="">独立任务（不加入迭代）</option><option th:each="story : ${view.stories}" th:if="${story.sprint == null or story.sprint.status.name() != 'COMPLETED' or (task != null and task.story != null and task.story.id == story.id)}" th:value="${story.id}" th:selected="${task == null ? story.id == selectedStory : task.story != null and story.id == task.story.id}" th:text="${story.title + ' · ' + (story.sprint == null ? '待规划' : story.sprint.name)}"></option></select></label>
<label>说明<textarea name="description" class="notion-input" maxlength="1000" rows="3" th:text="${task == null ? '' : task.description}"></textarea></label>
<div class="form-grid"><label>负责人<select name="assigneeId" class="notion-input" required><option value="">请选择成员</option><option th:each="member : ${view.activeMembers}" th:value="${member.user.id}" th:selected="${task != null and task.assignee.id == member.user.id}" th:text="${member.user.displayName}"></option></select></label><label>优先级<select name="priority" class="notion-input"><option th:each="p : ${T(com.aimanage.prototype.domain.Priority).values()}" th:value="${p}" th:selected="${task == null ? p.name() == 'MEDIUM' : p == task.priority}" th:text="${p.name() == 'URGENT' ? '紧急' : p.name() == 'HIGH' ? '高' : p.name() == 'LOW' ? '低' : '中'}"></option></select></label></div>
<label>截止日期<input type="date" name="dueDate" class="notion-input" th:value="${task == null ? null : task.dueDate}"></label>
<button class="notion-button primary-action" th:disabled="${#lists.isEmpty(view.activeMembers)}" th:text="${task == null ? '创建任务' : '保存修改'}"></button><a th:if="${#lists.isEmpty(view.activeMembers)}" th:href="@{/projects}">先添加正常参与的项目成员</a></form>
