<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><body>
<header th:fragment="toolbar(active)" class="page-toolbar">
 <div class="breadcrumbs"><span>爱管理</span><b>/</b><span>Sprint 管理</span></div>
 <div class="toolbar-actions"><span class="prototype-badge neutral" th:text="${active == 'overview' ? '迭代概览' : '任务甘特图'}"></span></div>
</header>
<section th:fragment="heading(active)" class="sprint-page-header">
 <div class="sprint-title-row"><span class="sprint-title-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3v4m8-4v4M4 10h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"/></svg></span>
 <div><h1>Sprint 管理</h1><p>查看迭代目标、时间范围与交付进度。</p></div></div>
 <nav class="sprint-view-tabs" aria-label="Sprint 视图">
 <a th:href="@{/iterations(projectId=${projectId})}" th:classappend="${active == 'overview' ? 'is-active' : ''}" th:attr="aria-current=${active == 'overview' ? 'page' : null}">迭代概览</a>
 <a th:if="${roleLabel != '系统管理员'}" th:href="@{/sprints(projectId=${projectId})}" th:classappend="${active == 'gantt' ? 'is-active' : ''}" th:attr="aria-current=${active == 'gantt' ? 'page' : null}">任务甘特图</a>
 </nav>
</section>
</body></html>
