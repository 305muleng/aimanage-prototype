<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>UML 视图 · 爱管理</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/uml.css(v='20261018-4')}"><link rel="stylesheet" th:href="@{/css/uml-simple.css(v='20261018-4')}"><link rel="stylesheet" th:href="@{/css/uml-workspace.css(v='20261018-links-1')}"></head>
<body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('uml')}"></aside><main class="main-column">
<header class="page-toolbar"><div class="breadcrumbs"><span>爱管理</span><b>/</b><span>UML 视图</span></div></header>
<div class="page-content uml-page"><h1>UML 视图</h1>
<p th:if="${error}" class="notice error" th:text="${error}"></p><span th:if="${success}" id="uml-action-success" hidden></span>
<div class="uml-project-bar"><form method="get" th:action="@{/uml}" class="uml-project"><label>项目<select class="notion-input" name="projectId" onchange="this.form.requestSubmit()"><option th:each="p : ${projects}" th:value="${p.id}" th:selected="${p.id == projectId}" th:text="${p.name}"></option></select></label></form>
<details th:if="${editable && projectId != null}" class="uml-new-menu"><summary>＋ 新建图 <span aria-hidden="true">⌄</span></summary><div class="uml-new-options"><form th:each="k : ${kinds}" method="post" th:action="@{/uml}"><input type="hidden" name="action" value="quick"><input type="hidden" name="projectId" th:value="${projectId}"><input type="hidden" name="kind" th:value="${k}"><input type="hidden" name="csrfToken" th:value="${csrf}"><button type="submit" th:text="${k.label}"></button></form></div></details></div>
<p th:if="${projectId == null}" class="notice">暂无可访问项目。</p>
<div th:if="${projectId != null}">
<p th:if="${#lists.isEmpty(views)}" class="uml-empty">尚未创建视图。通过“新建图”开始设计。</p>
<div th:if="${diagram != null}" class="uml-layout" id="uml-editor" th:attr="data-view-id=${viewId},data-project-id=${projectId},data-editable=${editable},data-csrf=${csrf}"><div class="uml-left-rail"><button type="button" class="uml-library-heading" id="uml-library-toggle" aria-expanded="true" aria-controls="uml-project-library"><span>项目图表 <b th:text="${#lists.size(views)}"></b></span><span class="uml-library-chevron" aria-hidden="true">⌃</span></button>
<nav id="uml-project-library" class="uml-views" aria-label="项目 UML 图"><div class="uml-view-card" th:each="v : ${views}"><a th:href="@{/uml(projectId=${projectId},viewId=${v.id})}" th:classappend="${v.id == viewId ? 'active' : ''}" th:title="${v.name}" th:attr="aria-current=${v.id == viewId ? 'page' : null}"><small th:text="${v.kind.label}"></small><span th:text="${v.name}"></span></a><form th:if="${editable}" class="uml-delete-view" method="post" th:action="@{/uml}" th:attr="data-view-name=${v.name}"><input type="hidden" name="action" value="deleteView"><input type="hidden" name="projectId" th:value="${projectId}"><input type="hidden" name="viewId" th:value="${v.id}"><input type="hidden" name="csrfToken" th:value="${csrf}"><button type="submit" th:attr="aria-label=|删除 ${v.name}|" title="删除这张图">删除</button></form></div></nav>
<section class="uml-diagram-links" id="uml-diagram-links" aria-label="当前图的关联内容"><div class="uml-related-heading"><h3>当前图关联</h3><span th:text="${diagram.name}" th:title="${diagram.name}"></span></div><div class="uml-related-list">
<div th:if="${!#lists.isEmpty(linkedStories)}" class="uml-related-group"><h4>用户故事 <span th:text="${#lists.size(linkedStories)}"></span></h4><div th:each="i : ${linkedStories}" class="uml-related-row"><a th:href="@{|/backlog?projectId=${projectId}#item-${i.id}|}" th:text="${i.title}" th:title="${i.title}"></a><a th:if="${editable}" class="uml-related-edit" th:href="@{|/backlog?projectId=${projectId}#edit-item-${i.id}|}" th:attr="aria-label=|编辑用户故事 ${i.title}|">编辑</a></div></div>
<div th:if="${!#lists.isEmpty(linkedTasks)}" class="uml-related-group"><h4>任务 <span th:text="${#lists.size(linkedTasks)}"></span></h4><div th:each="t : ${linkedTasks}" class="uml-related-row"><a th:href="${editable ? '/manager/tasks?projectId=' + projectId + '#task-' + t.id : '/my-tasks#task-' + t.id}" th:text="${t.title}" th:title="${t.title}"></a><a th:if="${editable}" class="uml-related-edit" th:href="@{/manager/tasks(projectId=${projectId},editTask=${t.id})} + '#task-' + ${t.id}" th:attr="aria-label=|编辑任务 ${t.title}|">编辑</a></div></div>
<p th:if="${restrictedLinkedTasks}" class="uml-related-empty">部分关联任务受访问权限限制。</p><p th:if="${#lists.isEmpty(linkedStories) && #lists.isEmpty(linkedTasks) && !restrictedLinkedTasks}" class="uml-related-empty">此图暂无关联</p></div></section>
<aside class="uml-panel"><div th:if="${editable}" class="uml-tools"><button type="button" class="notion-button" id="uml-connect">点选连线</button><span id="uml-quick-nodes"></span></div><section id="uml-edge-editor" hidden><h3 th:text="${diagram.kind.name() == 'SEQUENCE' ? '消息名称' : '连线名称'}"></h3><p id="uml-edge-selection"></p>
<form th:if="${editable}" id="uml-edge-form" method="post" th:action="@{/uml}" class="form-stack"><input type="hidden" name="action" value="renameEdge"><input type="hidden" name="projectId" th:value="${projectId}"><input type="hidden" name="viewId" th:value="${viewId}"><input type="hidden" name="csrfToken" th:value="${csrf}"><input type="hidden" name="id" value=""><label>名称<input name="label" class="notion-input" maxlength="100" placeholder="例如：提交登录请求"></label><button class="notion-button primary-action">保存连线名称</button><button class="notion-button" type="button" id="uml-edge-cancel">返回元素编辑</button></form></section>
<section id="uml-node-selection" th:hidden="${diagram.kind.name() == 'CLASS' && editable}"><h3 th:text="${diagram.kind.name() == 'CLASS' && editable ? '关联信息' : '元素详情'}"></h3><p id="uml-selection">选择一个节点查看关联。</p><div id="uml-links"></div></section>
<section th:if="${editable}" id="uml-node-panel"><h3 id="node-form-title" th:text="${diagram.kind.name() == 'CLASS' ? '新增类' : '新增元素'}"></h3><form id="uml-node-form" method="post" th:action="@{/uml}" class="form-stack">
<input type="hidden" name="action" value="node"><input type="hidden" name="projectId" th:value="${projectId}"><input type="hidden" name="viewId" th:value="${viewId}"><input type="hidden" name="csrfToken" th:value="${csrf}"><input type="hidden" name="id" value="">
<label th:hidden="${diagram.kind.name() == 'CLASS'}">元素类型<select class="notion-input" name="type">
<option th:if="${diagram.kind.name() == 'CLASS'}" value="CLASS">类</option>
<th:block th:if="${diagram.kind.name() == 'USE_CASE'}"><option value="ACTOR">参与者</option><option value="USECASE">用例</option></th:block>
<option th:if="${diagram.kind.name() == 'SEQUENCE'}" value="PARTICIPANT">参与对象 / 生命线</option>
<th:block th:if="${diagram.kind.name() == 'ACTIVITY'}"><option value="ACTIVITY">活动</option><option value="DECISION">判断</option><option value="START">开始</option><option value="END">结束</option></th:block>
</select></label><label><span th:text="${diagram.kind.name() == 'CLASS' ? '类名' : '名称'}"></span><input class="notion-input" name="label" required maxlength="100"></label>
<label th:if="${diagram.kind.name() == 'CLASS'}">属性 / 方法<textarea class="notion-input uml-class-members" name="details" maxlength="1000" rows="6" placeholder="每行一项，例如：&#10;- id: Long&#10;- name: String&#10;+ login(): boolean"></textarea></label>
<details class="uml-advanced"><summary th:text="${diagram.kind.name() == 'CLASS' ? '关联用户故事与任务' : '更多设置：结构说明、故事与任务关联'}"></summary><div class="form-stack"><label th:if="${diagram.kind.name() != 'CLASS'}">结构 / 说明<textarea class="notion-input" name="details" maxlength="1000" rows="3"></textarea></label>
<label>关联用户故事<select class="notion-input" name="storyId"><option value="">无关联</option><option th:each="i : ${stories}" th:value="${i.id}" th:text="${i.title}"></option></select></label>
<label>关联任务<select class="notion-input" name="taskId"><option value="">无关联</option><option th:each="t : ${tasks}" th:value="${t.id}" th:text="${t.title}"></option></select></label>
</div></details></form></section>
<details th:if="${editable}" class="uml-advanced"><summary>连线与消息设置</summary><section><h3 th:text="${diagram.kind.name() == 'SEQUENCE' ? '添加消息（按创建顺序）' : '添加连线'}"></h3><form method="post" th:action="@{/uml}" class="form-stack"><input type="hidden" name="action" value="edge"><input type="hidden" name="projectId" th:value="${projectId}"><input type="hidden" name="viewId" th:value="${viewId}"><input type="hidden" name="csrfToken" th:value="${csrf}">
<label>起点<select name="source" class="notion-input" required><option th:each="n : ${diagram.nodes}" th:value="${n.id}" th:text="${n.label}"></option></select></label><label>终点<select name="target" class="notion-input" required><option th:each="n : ${diagram.nodes}" th:value="${n.id}" th:text="${n.label}"></option></select></label><label>关系 / 消息<input class="notion-input" name="label" maxlength="100" placeholder="例如：调用、关联、[通过]"></label><button class="notion-button" th:disabled="${#lists.isEmpty(diagram.nodes)}">保存连线</button></form>
<details class="uml-edge-list"><summary>管理连线</summary><form th:each="e : ${diagram.edges}" method="post" th:action="@{/uml}"><input type="hidden" name="action" value="deleteEdge"><input type="hidden" name="projectId" th:value="${projectId}"><input type="hidden" name="viewId" th:value="${viewId}"><input type="hidden" name="id" th:value="${e.id}"><input type="hidden" name="csrfToken" th:value="${csrf}"><span th:text="|#${e.id} ${e.label}|"></span><button class="notion-button">移除</button></form></details></section>
</details><div th:if="${editable}" class="uml-form-actions" id="uml-node-actions"><button type="submit" form="uml-node-form" class="notion-button primary-action">保存</button><button type="button" class="notion-button" id="uml-clear">新增</button></div></aside></div><section class="uml-canvas-panel"><div class="uml-canvas-heading"><div><h2 th:text="${diagram.name}"></h2><span th:text="${diagram.kind.label}"></span></div><span id="uml-save-status" role="alert" hidden></span></div><div class="uml-canvas-scroll"><svg id="uml-canvas" viewBox="0 0 1800 1200" aria-label="UML 交互画布"></svg></div><p id="uml-empty-canvas" class="uml-empty" hidden>使用左侧按钮添加元素。</p></section></div></div></div></main></div><script th:src="@{/js/uml.js(v='20261018-links-1')}" defer></script></body></html>
